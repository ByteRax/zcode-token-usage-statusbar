  --color-tooltip: var(--neutral-100); --color-tooltip-foreground: var(--neutral-950);
  --color-tooltip-tag: var(--neutral-200);
  --color-tooltip-tag-foreground: color-mix(in oklab, var(--neutral-950) 60%, transparent);
  --color-input: #fff; --color-input-focused: var(--neutral-50);
  --color-input-border: var(--color-border); --color-input-border-hover: var(--color-border-hover);
  --color-input-border-focused: var(--color-brand);
  --color-brand: var(--sky-400); --color-accent: var(--sky-50);
  --color-card: #fff; --color-card-border: var(--color-border);
  --color-secondary: var(--neutral-300); --color-primary: var(--neutral-950); --color-primary-foreground: var(--neutral-50);

/* ---- 基础（宿主 html/body/#root 透明让位 vibrancy；harness 用背景色等价呈现） ---- */
html, body { margin: 0; height: 100%; }
body {
  background: var(--color-background); color: var(--color-foreground);
  /* Tailwind v4 默认 sans 栈（宿主无 --font-sans 定义，body 无显式 font-size） */
  font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
    "Segoe UI Symbol", "Noto Color Emoji";
  font-size: var(--ui-font-size);
}
button { font: inherit; }
svg { display: block; }

/* ---- 会话布局（SessionPane 根 + ConversationTimeline 消息列/底 dock） ---- */
.conv-root { display: flex; flex-direction: column; height: 100%; min-height: 0; position: relative;
  container-type: inline-size; container-name: conversation; }
.conv-scroll { flex: 1 1 0%; overflow-y: auto; min-height: 0; }
.conv-col { margin: 0 auto; width: 100%; padding: 16px 16px 0; }
@container conversation (min-width: 864px) { .conv-col { max-width: 896px; } }
@container conversation (min-width: 1280px) { .conv-col { max-width: 1152px; } }
/* 消息流为背景占位（非复刻对象），仅提供「有历史会话」的真实感 */
.msg-user { background: var(--color-surface); border-radius: 12px; padding: 10px 14px;
  margin: 8px 0; width: fit-content; max-width: 85%; margin-left: auto; }
.msg-assistant { color: var(--color-foreground); line-height: 1.625; margin: 14px 0; }
.msg-assistant .sub { color: var(--color-foreground-subtle); font-size: var(--text-ui-sm); }

/* 底 dock（ConversationTimeline 2145-2183：sticky bottom + 内容列 px-4 pb-4 + 同宽规则） */
.dock { position: sticky; bottom: 0; z-index: 20; display: flex; width: 100%; justify-content: center;
  pointer-events: none; }
.dock-content { pointer-events: auto; position: relative; z-index: 10; width: 100%; flex-shrink: 0;
  padding: 0 16px 16px;
  transition: width .15s ease-out, max-width .15s ease-out, transform .15s ease-out; }
@container conversation (min-width: 864px) { .dock-content { max-width: 896px; } }
@container conversation (min-width: 1280px) { .dock-content { max-width: 1152px; transition: transform .15s ease-out; } }
.dock-transition { display: grid; width: 100%; }
.dock-layer { grid-column-start: 1; grid-row-start: 1; width: 100%; min-width: 0;
  transform-origin: bottom; align-self: end; will-change: transform; }

/* ---- composer（ConversationComposer 2531-2539 / 2602-2702） ---- */
.chat-composer-region { z-index: 20; width: 100%; flex-shrink: 0;
  container-type: inline-size; container-name: composer; }
.chat-composer-input-surface { position: relative; width: 100%; }
.composer-form { position: relative; }

/* 输入壳（ChatPromptEditor 404-415）：flex flex-col gap-3 rounded-2xl border border-input-border
 * bg-input p-3 + hover/focus-within 变体（`!` 前缀以最高优先级落 focused 边框） */
.composer-shell { position: relative; display: flex; flex-direction: column; gap: 12px;
  overflow: hidden; border-radius: 16px; border: 1px solid var(--color-input-border);
  background: var(--color-input); padding: 12px;
  transition: border-color .15s, background-color .15s; }
.composer-shell:hover { border-color: var(--color-input-border-hover); }
.composer-shell:focus-within { border-color: var(--color-input-border-focused) !important;
  background: var(--color-input-focused); }

/* 编辑器（LexicalChatInput 1459-1470 + 1487-1490）：min-h-10 max-h-40 text-ui-base leading-5 */
.editor-root { position: relative; flex: 1 1 0%; }
.editor-inner { position: relative; }
.editor-input { min-height: 40px; max-height: 160px; overflow-y: auto; outline: none;
  font-size: var(--text-ui-base); line-height: 20px; color: var(--color-foreground);
  white-space: pre-wrap; word-break: break-word; caret-color: var(--color-foreground); }
.editor-placeholder { pointer-events: none; position: absolute; left: 0; top: 0;
  font-size: var(--text-ui-base); line-height: 20px;
  color: var(--color-foreground-subtlest); }
.editor-input.has-text ~ .editor-placeholder, .editor-placeholder.hidden-p { display: none; }

/* 工具行（ChatPromptEditor 440-457） */
.composer-toolbar { display: flex; align-items: flex-end; gap: 12px; }
.tb-leading { display: flex; min-width: 0; flex: 1 1 0%; align-items: center; }
.tb-leading-content { display: flex; flex-shrink: 0; align-items: center; gap: 4px; }
.tb-trailing { margin-left: auto; display: flex; flex-shrink: 0; align-items: center;
  justify-content: flex-end; gap: 6px; }

/* ---- Button（components/ui/button.tsx 基类 + variant/size） ---- */
.btn { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center;
  border-radius: 4px; border: 1px solid transparent; background-clip: padding-box;
  font-size: var(--text-ui-base); line-height: 1.625; white-space: nowrap;
  transition: color .15s, background-color .15s, border-color .15s; outline: none;
  user-select: none; cursor: pointer; padding: 0; background-color: transparent; }
.btn:disabled { pointer-events: none; opacity: 0.5; }
.btn > svg { pointer-events: none; flex-shrink: 0; }
.ic4 { width: 16px; height: 16px; } .ic35 { width: 14px; height: 14px; }
.btn.ghost { color: var(--color-foreground); }
.btn.ghost:hover, .btn.ghost[aria-expanded="true"] { background: var(--color-hover);
  color: var(--color-foreground); }
/* size=default：h-7 gap-1 px-2，svg 缺省 14px */
.btn.h7 { height: 28px; gap: 4px; padding: 0 8px; }
.btn.h7 > svg:not(.ic4) { width: 14px; height: 14px; }
/* size=icon-md：size-7 rounded-lg，svg 缺省 16px */
.btn.icon-md { width: 28px; height: 28px; border-radius: 8px; }
.btn.icon-md > svg { width: 16px; height: 16px; }

/* 模式按钮（V4ComposerModeControls 117-137）：ghost sm + h-7 gap-1 rounded-lg px-2；
 * yolo（完全访问）态整钮 text-warning 且 hover 不回退（126 行） */
.btn.mode { height: 28px; gap: 4px; border-radius: 8px; padding: 0 8px; }
.btn.mode > svg { flex-shrink: 0; }
.btn.mode .chev { width: 14px; height: 14px; color: var(--color-foreground-subtle); }
.btn.mode.mode-yolo { color: var(--color-warning); }
.btn.mode.mode-yolo:hover, .btn.mode.mode-yolo[aria-expanded="true"] { color: var(--color-warning); }
.btn.mode.mode-yolo .chev { color: inherit; }

    f('plot-fill-85pct', ratio >= fillMin,
      'plot=' + Math.round(pb.width) + ' contentBox=' + Math.round(denom) +
      ' ratio=' + (ratio * 100).toFixed(1) + '%');
  }
  /* ④ 月历底边空白 ≤ 1 行格高（最后一枚日格底 vs 网格底） */
  var grid = root.querySelector('.zu3-hm-grid');
  if (grid) {
    var cells = grid.querySelectorAll('.zu-hm-cell');
    var last = cells[cells.length - 1];
    if (last) {
      var gb = grid.getBoundingClientRect(), lb = last.getBoundingClientRect();
      var gap = gb.bottom - lb.bottom;
      f('month-bottom-gap', gap <= lb.height + 1,
        'gap=' + Math.round(gap) + ' cellH=' + Math.round(lb.height));
    }
  }
  /* ⑤ 筛选弹出层在视口内 */
  var fpop = root.querySelector('.zu-sv3-fpop');
  if (fpop) {
    var fb = fpop.getBoundingClientRect();
    var vw = window.innerWidth, vh = window.innerHeight;
    f('fpop-in-viewport', fb.x >= 0 && fb.y >= 0 && fb.right <= vw && fb.bottom <= vh,
      'rect=' + [Math.round(fb.x), Math.round(fb.y), Math.round(fb.right), Math.round(fb.bottom)].join(',') +
      ' vp=' + vw + 'x' + vh);
  }
  /* ---------- §12.7（v388 自适应批验收）----------
   * ⑥ V3 图表横滚容器无幻影溢出：.zu-sc-wrap scrollWidth==clientWidth（柱/折线/
   *   热力全形态挂载态；plot width:auto 根除 30px 幻影后恒等）；
   * ⑦ 筛选栏恒单行：.zu-sv3-fbar 高度 ≤ 44px（chips 预算 3 + 双层 nowrap 收纳）；
   * ⑧ 高度档位内联下发：root data-h-tier 在场且内联 min-height ∈ [300,480]
   *   （档位表 320..470 全覆盖，±10 盒模型校准余量在内）；
   * ⑨ 分布表无横向溢出：.zu-sv3-dwrap scrollWidth==clientWidth（§12.2 div Grid
   *   三列 minmax(0,1fr) 64px 44px 根除旧 table 23px 溢出；仅多模型态在场）。 */
  var wraps = root.querySelectorAll('.zu-sc-wrap');
  for (var wi = 0; wi < wraps.length; wi++) {
    var wEl = wraps[wi];
    /* tolerance ≤2px：flex 分数槽位的亚像素取整（PRD 15.1；>2px 仍是真溢出） */
    f('wrap-no-hscroll[' + wi + ']', wEl.scrollWidth <= wEl.clientWidth + 2,
      'scroll=' + wEl.scrollWidth + ' client=' + wEl.clientWidth);
  }
  var fbar = root.querySelector('.zu-sv3-fbar');
  if (fbar) {
    var fh = fbar.getBoundingClientRect().height;
    f('fbar-single-row', fh <= 44, 'fbarH=' + Math.round(fh));
  }
  var tierAttr = root.getAttribute('data-h-tier');
  var mhPx = parseFloat(root.style.height);
  /* §17：五形态统一 450（±10 盒模型校准）——任意范围/空态 root 固定高恒同（height 语义） */
  f('h-tier-inline', !!tierAttr && mhPx >= 440 && mhPx <= 460,
    'tier=' + tierAttr + ' height=' + root.style.height);
  var dwrap = root.querySelector('.zu-sv3-dwrap');
  if (dwrap) {
    f('dist-no-hscroll', dwrap.scrollWidth === dwrap.clientWidth,
      'scroll=' + dwrap.scrollWidth + ' client=' + dwrap.clientWidth);
    /* ⑯ 分布表恒展开（v394）：折叠按钮整链退役，全量行+dwrap 内滚 */
    var dRows = dwrap.querySelectorAll('.zu-sv3-drow');
    var nModels = (function () {
      var h = window.__zuDataMode === 'live' ? window.__zuLiveFixture : window.__zuFixture;
      return h && h.mnames ? h.mnames.length : 0;
    })();
    f('dist-always-expanded', !root.querySelector('[data-sv3-more],.zu-sv3-more') && dRows.length > 1,
      'rows=' + dRows.length + ' models=' + nModels +
      ' more=' + !!root.querySelector('[data-sv3-more],.zu-sv3-more'));
    if (nModels > 4) {
      f('dist-all-rows', dRows.length === nModels + 1,
        'rows=' + dRows.length + ' expected=' + (nModels + 1));
      var dcs = getComputedStyle(dwrap);
      var maxH = parseFloat(dcs.maxHeight) || 9999;
      f('dist-scrollable', /auto|scroll/.test(dcs.overflowY) && maxH <= 160 && dwrap.scrollHeight > dwrap.clientHeight,
        'overflowY=' + dcs.overflowY + ' maxH=' + dcs.maxHeight +
        ' scrollH=' + dwrap.scrollHeight + ' clientH=' + dwrap.clientHeight);
    }
  }
  /* ---------- ⑫ 分布条段等高（v390 第五轮专项）----------
   * .zu-sv3-dbar 每个可见段（width>0.5px，排除亚像素不可见段）与轨道的
   * top/bottom 误差 ≤0.5px、段间高度差 ≤0.5px；无独立圆角/边框/阴影/垂直
   * 位移（computed 核对）。真因甄别用：若几何全等仍观感参差，即颜色亮度/
   * 抗锯齿错觉，不是布局错位。 */
  var dbar = root.querySelector('.zu-sv3-dbar');
  if (dbar) {
    var brail = dbar.getBoundingClientRect();
    var vis = [];
    for (var dc = dbar.firstElementChild; dc; dc = dc.nextElementSibling) {
      var dr = dc.getBoundingClientRect();
      if (dr.width > 0.5) vis.push({ el: dc, r: dr });
    }
    if (vis.length) {
      var tops = vis.map(function (v) { return +(v.r.top - brail.top).toFixed(2); });
      var bots = vis.map(function (v) { return +(v.r.bottom - brail.bottom).toFixed(2); });
      var hs2 = vis.map(function (v) { return +v.r.height.toFixed(2); });
      var dTop = Math.max.apply(null, tops) - Math.min.apply(null, tops);
      var dBot = Math.max.apply(null, bots) - Math.min.apply(null, bots);
      var dH = Math.max.apply(null, hs2) - Math.min.apply(null, hs2);
      f('dbar-segs-equal', dTop <= 0.5 && dBot <= 0.5 && dH <= 0.5,
        'segs=' + vis.length + ' dTop=' + dTop + ' dBot=' + dBot + ' dH=' + dH +
        ' railH=' + Math.round(brail.height));
      var badStyle = vis.filter(function (v) {
        var s = getComputedStyle(v.el);
        return s.display !== 'block' || s.borderRadius !== '0px' ||
          parseFloat(s.borderTopWidth) > 0 || s.boxShadow !== 'none' ||
          (s.transform && s.transform !== 'none');
      });
      f('dbar-segs-style', badStyle.length === 0,
        badStyle.length ? 'bad=' + badStyle.length : 'all-segments-clean');
    }
  }
  /* ---------- §13.1/§13.7 + §17（v393 统一高批验收）----------
   * ⑩ plot 弹性高：flex:1 吸收左卡/档位拉伸——min-height 200 保底；v393 起 300 上限
   *   随五形态统一 450 废除，plot 吃满卡内剩余（450 卡下典型 ≈370..400）。
   *   X 标签带贴底：plot 底距图表卡内容底 ≤28px（wrap 5px + 卡 padding 10px 正常
   *   ≈15px；>28px 即 plot 未贴底/卡底出现推底空腔的形态回归）。
   *   recent/today/week 三形态有 .zu-sc-plot；month/hist 热力无 plot 自动跳过。 */
  if (plot && chart) {
    var pb10 = plot.getBoundingClientRect();
    f('plot-flex-height', pb10.height >= 199,
      'plotH=' + Math.round(pb10.height));
    var cb10 = chart.getBoundingClientRect();
    var ccs10 = getComputedStyle(chart);
    var gap10 = cb10.bottom - (parseFloat(ccs10.paddingBottom) || 0) - pb10.bottom;
    f('plot-bottom-gap-28', gap10 <= 28.5,
      'gap=' + Math.round(gap10) + ' (plotBottom=' + Math.round(pb10.bottom) +
      ' contentBottom=' + Math.round(cb10.bottom - (parseFloat(ccs10.paddingBottom) || 0)) + ')');
  }
  /* ---------- §14.1（v390 入口统一批验收）----------
   * ⑪ fpop 锚定筛选栏正下方：top ≥ fbar 底（gap ≥ −1 容差亚像素）、贴近触发器
   *   （gap ≤ 24px，默认 top:87px 与 fopen 动态 pop.top 两路径都应落在带内）；
   *   且完全在视口内（与 ⑤ 同判据——⑤ 沿用旧名保兼容，⑪ 语义=锚定+视口合一）。
   *   fpop 未挂载（关闭态）自动跳过。 */
  var fpop11 = root.querySelector('.zu-sv3-fpop');
  if (fpop11) {
    var fp11 = fpop11.getBoundingClientRect();
    var bar11 = root.querySelector('.zu-sv3-fbar');
    if (bar11) {
      var bb11 = bar11.getBoundingClientRect();
      var gap11 = fp11.top - bb11.bottom;
      f('fpop-below-fbar', gap11 >= -1 && gap11 <= 24,
        'gap=' + Math.round(gap11) + 'px (fbarBottom=' + Math.round(bb11.bottom) +
        ' fpopTop=' + Math.round(fp11.top) + ')');
    }
    var vw11 = window.innerWidth, vh11 = window.innerHeight;
    f('fpop-in-viewport-anchored', fp11.x >= 0 && fp11.y >= 0 && fp11.right <= vw11 && fp11.bottom <= vh11,
      'rect=' + [Math.round(fp11.x), Math.round(fp11.y), Math.round(fp11.right), Math.round(fp11.bottom)].join(',') +
      ' vp=' + vw11 + 'x' + vh11);
  }
  /* ---------- §15.2（v391 单层边框）----------
   * ⑬ 外层卡 [data-sv3-chart] computed border 恒 1px（外层卡边界保留）；charts 注入
   *   的内层 .zu-speed-chart 同名盒 border/padding 恒 0（曾双重命中同一规则）。
   *   内层盒仅柱/折线视图存在（热力内层类 zu-sv-chart 不带 zu-sv3-chart），
   *   缺席自动跳过。 */
  if (chart) {
    var bcs13 = getComputedStyle(chart);
    var bw13 = parseFloat(bcs13.borderRightWidth) || 0;
    f('chart-card-border-1px', Math.abs(bw13 - 1) < 0.3, 'outerBorder=' + bcs13.borderRightWidth);
    var inner13 = chart.querySelector('.zu-speed-chart');
    if (inner13) {
      var ics13 = getComputedStyle(inner13);
      var ibw = parseFloat(ics13.borderRightWidth) || 0, ipad = (parseFloat(ics13.paddingLeft) || 0) +
        (parseFloat(ics13.paddingRight) || 0);
      f('chart-inner-no-border', ibw === 0 && ipad === 0,
        'innerBorder=' + ics13.borderRightWidth + ' innerPadH=' + ipad);
    }
  }
  /* ---------- §15.5（v391 柱标统一）----------
   * ⑭ 可见 .zu-sc-val（有文本读数）两两矩形不相交（横向交叠且纵向交叠均 >0.5px 才
   *   算重叠——同列上下关系不存在，标签只在柱顶）；首末柱标签完全在 plot 矩形内
   *   （estW>slotW 时 vpin-l/r 钉边防裁切）。折线/热力无 .zu-sc-val 自动跳过。 */
  var plot14 = root.querySelector('.zu-sc-plot');
  if (plot14) {
    var labs = [];
    for (var lv = root.querySelectorAll('.zu-sc-val'), li = 0; li < lv.length; li++) {
      if ((lv[li].textContent || '').length && lv[li].offsetParent) labs.push(lv[li].getBoundingClientRect());
    }
    var overlap = 0;
    for (var la = 0; la < labs.length; la++) for (var lb2 = la + 1; lb2 < labs.length; lb2++) {
      var ox = Math.min(labs[la].right, labs[lb2].right) - Math.max(labs[la].left, labs[lb2].left);
      var oy = Math.min(labs[la].bottom, labs[lb2].bottom) - Math.max(labs[la].top, labs[lb2].top);
      if (ox > 0.5 && oy > 0.5) overlap++;
    }
    f('bar-labels-no-overlap', overlap === 0,
      'labels=' + labs.length + ' overlaps=' + overlap);
    var pr14 = plot14.getBoundingClientRect();
    var edge = 0;
    for (var le = 0; le < labs.length; le++) {
      if (labs[le].left < pr14.left - 0.5 || labs[le].right > pr14.right + 0.5) edge++;
    }
    f('bar-labels-in-plot', edge === 0, 'out-of-plot=' + edge + ' of ' + labs.length);
  }
  /* ---------- §15.3（v391 短历史居中）----------
   * ⑮ cal 形态：行高帽封顶后周头+网格作为整组在 wrap 内垂直居中——组上留白与组下
   *   留白差 ≤16px（行多填满时两侧留白≈0 自然满足）。dc 形态：卡高帽下卡组在网格
   *   内垂直居中（首卡上留白 vs 末卡下留白差 ≤16px）。柱/折线形态自动跳过。 */
  var cal15 = root.querySelector('.zu3-cal');
  var dc15 = root.querySelector('.zu3-dc');
  if (cal15) {
    var w15 = cal15.querySelector('.zu-sc-wrap');
    var grid15 = cal15.querySelector('.zu3-hm-grid');
    if (w15 && grid15) {
      var wr15 = w15.getBoundingClientRect(), gr15 = grid15.getBoundingClientRect();
      var wk15 = cal15.querySelector('.zu3-hm-week');
      var gTop = wk15 ? wk15.getBoundingClientRect().top : gr15.top;
      var gapTop = gTop - wr15.top, gapBot = wr15.bottom - gr15.bottom;
      f('sparse-centered', Math.abs(gapTop - gapBot) <= 16,
        'gapTop=' + Math.round(gapTop) + ' gapBot=' + Math.round(gapBot));
    }
  } else if (dc15) {
    var dg15 = dc15.querySelector('.zu3-dc-grid');
    var cells15 = dg15 ? dg15.querySelectorAll('.zu-hm-cell') : [];
    if (dg15 && cells15.length) {
      var dgr = dg15.getBoundingClientRect();
      var cTop = cells15[0].getBoundingClientRect().top;
      var cBot = cells15[cells15.length - 1].getBoundingClientRect().bottom;
      var dGapT = cTop - dgr.top, dGapB = dgr.bottom - cBot;
      f('sparse-centered', Math.abs(dGapT - dGapB) <= 16,
        'gapTop=' + Math.round(dGapT) + ' gapBot=' + Math.round(dGapB));
    }
  }
  return out;
};
</script>
</body>
</html>
