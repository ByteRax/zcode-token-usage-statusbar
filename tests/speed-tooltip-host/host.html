  --color-tooltip: var(--neutral-100); --color-tooltip-foreground: var(--neutral-950);
  --color-tooltip-tag: var(--neutral-200);
  --color-tooltip-tag-foreground: color-mix(in oklab, var(--neutral-950) 60%, transparent);
  --color-input: #fff; --color-input-focused: var(--neutral-50);
  --color-input-border: var(--color-border); --color-input-border-hover: var(--color-border-hover);
  --color-input-border-focused: var(--color-brand);
  --color-brand: var(--sky-400); --color-accent: var(--sky-50);
  --color-card: #fff; --color-card-border: var(--color-border);
  --color-secondary: var(--neutral-300); --color-primary: var(--neutral-950); --color-primary-foreground: var(--neutral-50);

/* ---- 基础（宿主 html/body/#root 透明让位 vibrancy；harness 用背景色等价呈现） ---- */
html, body { margin: 0; height: 100%; }
body {
  background: var(--color-background); color: var(--color-foreground);
  /* Tailwind v4 默认 sans 栈（宿主无 --font-sans 定义，body 无显式 font-size） */
  font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
    "Segoe UI Symbol", "Noto Color Emoji";
  font-size: var(--ui-font-size);
}
button { font: inherit; }
svg { display: block; }

/* ---- 会话布局（SessionPane 根 + ConversationTimeline 消息列/底 dock） ---- */
.conv-root { display: flex; flex-direction: column; height: 100%; min-height: 0; position: relative;
  container-type: inline-size; container-name: conversation; }
.conv-scroll { flex: 1 1 0%; overflow-y: auto; min-height: 0; }
.conv-col { margin: 0 auto; width: 100%; padding: 16px 16px 0; }
@container conversation (min-width: 864px) { .conv-col { max-width: 896px; } }
@container conversation (min-width: 1280px) { .conv-col { max-width: 1152px; } }
/* 消息流为背景占位（非复刻对象），仅提供「有历史会话」的真实感 */
.msg-user { background: var(--color-surface); border-radius: 12px; padding: 10px 14px;
  margin: 8px 0; width: fit-content; max-width: 85%; margin-left: auto; }
.msg-assistant { color: var(--color-foreground); line-height: 1.625; margin: 14px 0; }
.msg-assistant .sub { color: var(--color-foreground-subtle); font-size: var(--text-ui-sm); }

/* 底 dock（ConversationTimeline 2145-2183：sticky bottom + 内容列 px-4 pb-4 + 同宽规则） */
.dock { position: sticky; bottom: 0; z-index: 20; display: flex; width: 100%; justify-content: center;
  pointer-events: none; }
.dock-content { pointer-events: auto; position: relative; z-index: 10; width: 100%; flex-shrink: 0;
  padding: 0 16px 16px;
  transition: width .15s ease-out, max-width .15s ease-out, transform .15s ease-out; }
@container conversation (min-width: 864px) { .dock-content { max-width: 896px; } }
@container conversation (min-width: 1280px) { .dock-content { max-width: 1152px; transition: transform .15s ease-out; } }
.dock-transition { display: grid; width: 100%; }
.dock-layer { grid-column-start: 1; grid-row-start: 1; width: 100%; min-width: 0;
  transform-origin: bottom; align-self: end; will-change: transform; }

/* ---- composer（ConversationComposer 2531-2539 / 2602-2702） ---- */
.chat-composer-region { z-index: 20; width: 100%; flex-shrink: 0;
  container-type: inline-size; container-name: composer; }
.chat-composer-input-surface { position: relative; width: 100%; }
.composer-form { position: relative; }

/* 输入壳（ChatPromptEditor 404-415）：flex flex-col gap-3 rounded-2xl border border-input-border
 * bg-input p-3 + hover/focus-within 变体（`!` 前缀以最高优先级落 focused 边框） */
.composer-shell { position: relative; display: flex; flex-direction: column; gap: 12px;
  overflow: hidden; border-radius: 16px; border: 1px solid var(--color-input-border);
  background: var(--color-input); padding: 12px;
  transition: border-color .15s, background-color .15s; }
.composer-shell:hover { border-color: var(--color-input-border-hover); }
.composer-shell:focus-within { border-color: var(--color-input-border-focused) !important;
  background: var(--color-input-focused); }

/* 编辑器（LexicalChatInput 1459-1470 + 1487-1490）：min-h-10 max-h-40 text-ui-base leading-5 */
.editor-root { position: relative; flex: 1 1 0%; }
.editor-inner { position: relative; }
.editor-input { min-height: 40px; max-height: 160px; overflow-y: auto; outline: none;
  font-size: var(--text-ui-base); line-height: 20px; color: var(--color-foreground);
  white-space: pre-wrap; word-break: break-word; caret-color: var(--color-foreground); }
.editor-placeholder { pointer-events: none; position: absolute; left: 0; top: 0;
  font-size: var(--text-ui-base); line-height: 20px;
  color: var(--color-foreground-subtlest); }
.editor-input.has-text ~ .editor-placeholder, .editor-placeholder.hidden-p { display: none; }

/* 工具行（ChatPromptEditor 440-457） */
.composer-toolbar { display: flex; align-items: flex-end; gap: 12px; }
.tb-leading { display: flex; min-width: 0; flex: 1 1 0%; align-items: center; }
.tb-leading-content { display: flex; flex-shrink: 0; align-items: center; gap: 4px; }
.tb-trailing { margin-left: auto; display: flex; flex-shrink: 0; align-items: center;
  justify-content: flex-end; gap: 6px; }

/* ---- Button（components/ui/button.tsx 基类 + variant/size） ---- */
.btn { display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center;
  border-radius: 4px; border: 1px solid transparent; background-clip: padding-box;
  font-size: var(--text-ui-base); line-height: 1.625; white-space: nowrap;
  transition: color .15s, background-color .15s, border-color .15s; outline: none;
  user-select: none; cursor: pointer; padding: 0; background-color: transparent; }
.btn:disabled { pointer-events: none; opacity: 0.5; }
.btn > svg { pointer-events: none; flex-shrink: 0; }
.ic4 { width: 16px; height: 16px; } .ic35 { width: 14px; height: 14px; }
.btn.ghost { color: var(--color-foreground); }
.btn.ghost:hover, .btn.ghost[aria-expanded="true"] { background: var(--color-hover);
  color: var(--color-foreground); }
/* size=default：h-7 gap-1 px-2，svg 缺省 14px */
.btn.h7 { height: 28px; gap: 4px; padding: 0 8px; }
.btn.h7 > svg:not(.ic4) { width: 14px; height: 14px; }
/* size=icon-md：size-7 rounded-lg，svg 缺省 16px */
.btn.icon-md { width: 28px; height: 28px; border-radius: 8px; }
.btn.icon-md > svg { width: 16px; height: 16px; }

/* 模式按钮（V4ComposerModeControls 117-137）：ghost sm + h-7 gap-1 rounded-lg px-2；
 * yolo（完全访问）态整钮 text-warning 且 hover 不回退（126 行） */
.btn.mode { height: 28px; gap: 4px; border-radius: 8px; padding: 0 8px; }
.btn.mode > svg { flex-shrink: 0; }
.btn.mode .chev { width: 14px; height: 14px; color: var(--color-foreground-subtle); }
.btn.mode.mode-yolo { color: var(--color-warning); }
.btn.mode.mode-yolo:hover, .btn.mode.mode-yolo[aria-expanded="true"] { color: var(--color-warning); }
.btn.mode.mode-yolo .chev { color: inherit; }
